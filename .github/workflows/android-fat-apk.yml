name: Android Fat APK (branch test build)

# Branch-only build: pushes to build/** produce a single arm64 release APK with
# both models embedded, published to the `android-test` prerelease so a phone
# can download it directly. Never touches main's `latest-build` release.
on:
  push:
    branches: ['build/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-fat-apk
  cancel-in-progress: true

env:
  # Both files are byte-identical (sha256-verified) to these public,
  # ungated, Apache-2.0 Hugging Face downloads.
  CHAT_URL: https://huggingface.co/litert-community/Qwen3-0.6B/resolve/main/Qwen3-0.6B.litertlm
  CHAT_SHA: 555579ff2f4fd13379abe69c1c3ab5200f7338bc92471557f1d6614a6e5ab0b4
  TRANSLATE_URL: https://huggingface.co/qvac/TranslatePsy-AfriSLM-0.8B-Q4-GGUF/resolve/main/TranslatePsy-AfriSLM-0.8B-Q4_K_M-imat.gguf
  TRANSLATE_SHA: 4af8ee1df3ec9008f763ebe95e6f21df3acd8d42c541feeb13314ca22e560afc
  RELEASE_TAG: android-test

jobs:
  build:
    name: Build fat APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show disk space
        run: df -h /

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.x'
          cache: true

      - name: Fetch models into APK assets
        run: |
          set -euo pipefail
          dest=android/app/src/main/assets/models
          mkdir -p "$dest"
          curl -fL --retry 3 --retry-all-errors -o "$dest/chat-model.litertlm" "$CHAT_URL"
          curl -fL --retry 3 --retry-all-errors -o "$dest/translate-afrislm.gguf" "$TRANSLATE_URL"
          echo "$CHAT_SHA  $dest/chat-model.litertlm" | sha256sum -c -
          echo "$TRANSLATE_SHA  $dest/translate-afrislm.gguf" | sha256sum -c -
          ls -lh "$dest"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter config --enable-native-assets || true
          flutter build apk --release --target-platform android-arm64

      - name: Name the APK
        id: apk
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          name="ai-connect-africa-${version}-with-models-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$name"
          ls -lh "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publish to android-test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Android test build (models included)" \
              --notes "Unsigned-for-store test APK built from a build/** branch. arm64-v8a only. Chat + translation models are embedded; first launch copies ~1.2 GB into app storage, so keep ~2.5 GB free. Not a stable release."
          fi
          gh release upload "$RELEASE_TAG" "${{ steps.apk.outputs.name }}" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/${{ steps.apk.outputs.name }}"
