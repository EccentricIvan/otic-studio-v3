name: Test builds (Android APK + Windows zip)

# Branch-only build: pushes to build/** produce a single arm64 release APK with
# both models embedded, plus a Windows zip with a models/ folder beside the
# exe, both published to the `android-test` prerelease so a phone or PC can
# download them directly. Never touches main's `latest-build` release.
on:
  push:
    branches: ['build/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-fat-apk
  cancel-in-progress: true

env:
  # Both files are byte-identical (sha256-verified) to these public,
  # ungated, Apache-2.0 Hugging Face downloads.
  CHAT_URL: https://huggingface.co/litert-community/Qwen3-0.6B/resolve/main/Qwen3-0.6B.litertlm
  CHAT_SHA: 555579ff2f4fd13379abe69c1c3ab5200f7338bc92471557f1d6614a6e5ab0b4
  TRANSLATE_URL: https://huggingface.co/qvac/TranslatePsy-AfriSLM-0.8B-Q4-GGUF/resolve/main/TranslatePsy-AfriSLM-0.8B-Q4_K_M-imat.gguf
  TRANSLATE_SHA: 4af8ee1df3ec9008f763ebe95e6f21df3acd8d42c541feeb13314ca22e560afc
  RELEASE_TAG: android-test

jobs:
  build:
    name: Build fat APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show disk space
        run: df -h /

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.x'
          cache: true

      - name: Fetch models into APK assets
        run: |
          set -euo pipefail
          dest=android/app/src/main/assets/models
          mkdir -p "$dest"
          curl -fL --retry 3 --retry-all-errors -o "$dest/chat-model.litertlm" "$CHAT_URL"
          curl -fL --retry 3 --retry-all-errors -o "$dest/translate-afrislm.gguf" "$TRANSLATE_URL"
          echo "$CHAT_SHA  $dest/chat-model.litertlm" | sha256sum -c -
          echo "$TRANSLATE_SHA  $dest/translate-afrislm.gguf" | sha256sum -c -
          ls -lh "$dest"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter config --enable-native-assets || true
          flutter build apk --release --target-platform android-arm64

      - name: Name the APK
        id: apk
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          name="ai-connect-africa-${version}-with-models-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$name"
          ls -lh "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publish to android-test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Android test build (models included)" \
              --notes "Unsigned-for-store test APK built from a build/** branch. arm64-v8a only. Chat + translation models are embedded; first launch copies ~1.2 GB into app storage, so keep ~2.5 GB free. Not a stable release."
          fi
          gh release upload "$RELEASE_TAG" "${{ steps.apk.outputs.name }}" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/${{ steps.apk.outputs.name }}"

  windows:
    name: Build Windows zip (with models)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.x'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      # ModelManager/AfriSlmModelManager both check <exe dir>/models/ first, so
      # dropping the files beside the exe makes the zip self-contained.
      - name: Fetch models beside the exe
        shell: pwsh
        run: |
          $dest = 'build/windows/x64/runner/Release/models'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Invoke-WebRequest -Uri $env:CHAT_URL -OutFile "$dest/chat-model.litertlm" -UseBasicParsing
          Invoke-WebRequest -Uri $env:TRANSLATE_URL -OutFile "$dest/translate-afrislm.gguf" -UseBasicParsing
          foreach ($p in @(@("$dest/chat-model.litertlm", $env:CHAT_SHA), @("$dest/translate-afrislm.gguf", $env:TRANSLATE_SHA))) {
            $actual = (Get-FileHash $p[0] -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $p[1]) { throw "Checksum mismatch for $($p[0]): $actual" }
          }
          Get-ChildItem $dest | Format-Table Name, Length

      - name: Sign Windows binaries
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Host '::warning::Unsigned Windows build - machines with Smart App Control on will refuse to start it (0xC0E90002).'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          try {
            ./tools/sign_windows_build.ps1 -Path 'build/windows/x64/runner/Release' -PfxPath $pfx -PfxPassword $env:WINDOWS_CERT_PASSWORD
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Zip and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:').Line -replace 'version:\s*','' -replace '\+.*',''
          $name = "ai-connect-africa-$version-windows-with-models.zip"
          # Fastest: the model files are already compressed, so effort is wasted.
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath $name -CompressionLevel Fastest -Force
          Get-Item $name | Format-List Name, Length
          gh release upload $env:RELEASE_TAG $name --repo $env:GITHUB_REPOSITORY --clobber
          Write-Host "Download: https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$name"
