name: Build Release Artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.x'
          cache: true

      - name: Install Android native toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/ai-connect-africa-latest.apk"
          cd dist && zip ai-connect-africa-latest-apk.zip ai-connect-africa-latest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI Connect Africa Latest APK
          path: |
            dist/ai-connect-africa-latest.apk
            dist/ai-connect-africa-latest-apk.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.x'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Prepare Windows zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\ai-connect-africa-windows-latest.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI Connect Africa Windows Latest
          path: dist/ai-connect-africa-windows-latest.zip
          if-no-files-found: error

  publish-latest:
    name: Publish Latest Build
    runs-on: ubuntu-latest
    needs: [build-apk, build-windows]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          find dist -type f -maxdepth 3 -print
          cp "dist/AI Connect Africa Latest APK/ai-connect-africa-latest.apk" "./ai-connect-africa-latest.apk"
          cp "dist/AI Connect Africa Latest APK/ai-connect-africa-latest-apk.zip" "./ai-connect-africa-latest-apk.zip"
          cp "dist/AI Connect Africa Windows Latest/ai-connect-africa-windows-latest.zip" "./ai-connect-africa-windows-latest.zip"

      - name: Update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create latest-build \
              --repo "$GITHUB_REPOSITORY" \
              --title "AI Connect Africa Latest Build" \
              --notes "Automatically built APK and Windows zip from the latest main branch."
          fi
          gh release upload latest-build \
            "ai-connect-africa-latest.apk" \
            "ai-connect-africa-latest-apk.zip" \
            "ai-connect-africa-windows-latest.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
