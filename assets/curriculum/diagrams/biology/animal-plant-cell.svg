<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Animal and plant cell comparison">
  <rect width="520" height="300" fill="#EFF6FF"/>
  <text x="130" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#1D4ED8">Animal cell</text>
  <text x="390" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#15803D">Plant cell</text>
  <ellipse cx="130" cy="165" rx="88" ry="98" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <circle cx="130" cy="155" r="24" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="130" y="159" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#1E3A8A">Nucleus</text>
  <ellipse cx="108" cy="188" rx="16" ry="10" fill="#93C5FD" stroke="#2563EB" stroke-width="1"/>
  <text x="108" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#1E3A8A">Mito</text>
  <rect x="78" y="118" width="104" height="94" rx="44" fill="none" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="130" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#1D4ED8">Cell membrane</text>
  <rect x="292" y="52" width="196" height="196" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/>
  <rect x="302" y="62" width="176" height="176" rx="72" fill="#BBF7D0" stroke="#22C55E" stroke-width="2"/>
  <circle cx="390" cy="150" r="22" fill="#86EFAC" stroke="#15803D" stroke-width="1.5"/>
  <text x="390" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#14532D">Nucleus</text>
  <ellipse cx="350" cy="118" rx="18" ry="12" fill="#4ADE80" stroke="#16A34A" stroke-width="1"/>
  <text x="350" y="121" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#14532D">Chloro</text>
  <rect x="420" y="118" width="28" height="70" rx="6" fill="#A7F3D0" stroke="#059669" stroke-width="1"/>
  <text x="434" y="156" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#065F46">Vacuole</text>
  <text x="390" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#166534">Cell wall + membrane</text>
  <text x="260" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#334155">Plant cells add: cell wall, chloroplasts, large vacuole</text>
</svg>
