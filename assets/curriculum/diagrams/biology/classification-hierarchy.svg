<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img" aria-label="Classification hierarchy">
  <rect width="420" height="260" fill="#FAF5FF"/>
  <text x="210" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#6D28D9">Classification Hierarchy</text>
  <g font-family="Arial,sans-serif" font-size="12" font-weight="600">
    <rect x="160" y="38" width="100" height="24" rx="6" fill="#DDD6FE"/><text x="210" y="55" text-anchor="middle" fill="#5B21B6">Kingdom</text>
    <rect x="145" y="72" width="130" height="24" rx="6" fill="#C4B5FD"/><text x="210" y="89" text-anchor="middle" fill="#5B21B6">Phylum</text>
    <rect x="130" y="106" width="160" height="24" rx="6" fill="#A78BFA"/><text x="210" y="123" text-anchor="middle" fill="#4C1D95">Class</text>
    <rect x="115" y="140" width="190" height="24" rx="6" fill="#8B5CF6"/><text x="210" y="157" text-anchor="middle" fill="#FFFFFF">Order</text>
    <rect x="100" y="174" width="220" height="24" rx="6" fill="#7C3AED"/><text x="210" y="191" text-anchor="middle" fill="#FFFFFF">Family</text>
    <rect x="85" y="208" width="250" height="24" rx="6" fill="#6D28D9"/><text x="210" y="225" text-anchor="middle" fill="#FFFFFF">Genus ’ Species</text>
  </g>
  <text x="210" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#64748B">Broadest at top ’ most specific at bottom</text>
</svg>
