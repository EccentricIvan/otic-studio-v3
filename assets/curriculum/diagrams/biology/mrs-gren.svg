  <circle cx="240" cy="150" r="78" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="240" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#047857">Living</text>
  <g font-family="Arial,sans-serif" font-size="11" fill="#064E3B">
    <rect x="208" y="44" width="64" height="22" rx="11" fill="#A7F3D0"/><text x="240" y="59" text-anchor="middle">Movement</text>
    <rect x="338" y="72" width="72" height="22" rx="11" fill="#A7F3D0"/><text x="374" y="87" text-anchor="middle">Respiration</text>
