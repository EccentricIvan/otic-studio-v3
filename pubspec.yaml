name: otic_studio
description: Otic Studio - Offline AI Learning Operating System
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation + UI
  go_router: ^14.0.0
  flutter_riverpod: ^2.5.1

  # AI inference — Ollama local server + flutter_gemma fallback
  http: ^1.2.0
  flutter_gemma: ^1.0.3
  flutter_gemma_mediapipe: ^1.0.0
  ffi: ^2.1.0

  # Local storage — student memory, history summaries
  drift: ^2.20.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # Model installer — lets the user pick the Gemma file from USB/Downloads
  file_picker: 8.3.7

  # User preferences (theme mode)
  shared_preferences: ^2.2.3

  # Web Dev Lab — render student HTML in a WebView
  webview_flutter: ^4.10.0

  # PDF certificate generation (offline, pure Dart)
  pdf: ^3.10.8
  webview_flutter_windows: ^1.0.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  assets:
    - assets/models/        # placeholder dir, actual model files gitignored
    - assets/prompts/       # system prompt templates
    - assets/branding/      # official brand logo
    - assets/curriculum/    # bundled curriculum content for all subjects
    - assets/templates/     # website templates for Site Builder

  # Bundled offline — google_fonts would fetch over the network at runtime
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
